name: Something isn't working
description: A problem with the website, such as a page, a game, search, sound, or how it looks on your device.
title: "Problem: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for letting us know. What you write here is **public**, so please don't include private information.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What were you doing, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen? (optional)
  - type: input
    id: page
    attributes:
      label: Page
      description: The page you were on. This is filled in when you come from the dictionary's "Send feedback" page.
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For example "iPhone, Safari" or "Windows laptop, Chrome". This is filled in when you come from the dictionary.
