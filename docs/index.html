<template id="about-tpl">
  <article class="prose">
    <h2>About this dictionary</h2>
    <p>This site presents the Kullilli dictionary as a searchable wordlist with recordings.
       It currently holds <strong data-stat="entries"></strong> entries.</p>
    <p class="about-updated" data-updated>Last updated <strong data-date="site"></strong>.
       The words were last edited on <span data-date="edited"></span>.</p>
    <p>Remember that the dictionary is a work in progress, and we are adding information all the time. It has words
       and word endings. A lot of the word endings start with <span class="v">-a</span>, so they come first in the
       alphabetical list. You can search for words in Kullilli or English. If we have an example of a word in a
       sentence, we've included it. There is also information about how each word was originally written in the
       sources, which helps us work out how it might be pronounced.</p>

    <h3>Browsing and listening</h3>
    <p>Use the <strong>Wordlist</strong> tab to browse by letter. <em>dh, dy, ng, nh, ny, th</em> and <em>ty</em> are
       letters of their own and come after the single letter they start with (<em>dh</em> and <em>dy</em> after <em>d</em>).
       The buttons above the list narrow it to nouns, verbs and so on. Tap any card to open the full entry;
       use the ‹ › buttons (or the arrow keys) to step through neighbouring entries.</p>
    <p>The switch at the top of the wordlist changes the order. <strong>Kullilli → English</strong> lists Kullilli
       words; <strong>English → Kullilli</strong> lists English words A–Z, each with its Kullilli word, for people
       coming to Kullilli from English; <strong>By topic</strong> groups words by subject, such as birds, the body
       or food. All three open the same full entries.</p>
    <p>Words with a recording have a speaker button
       <span class="play inline" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="spk" d="M3 9.5v5h4l5 4v-13l-5 4H3z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></span>
       on their card and next to the word in the entry. Tap it to listen; tap again to stop.</p>
    <p>Suffixes are in the wordlist under their first letter and also have their own <strong>Affixes</strong> tab.
       The hyphen shows where a suffix attaches (<span class="v">-ya</span>).</p>

    <h3>Learning</h3>
    <p>The <strong>Learn</strong> tab has games for practising words: <em>Daily five</em> and <em>Flashcards</em> for
       every day, games for matching words and meanings, listening games, and spelling games. Each game lets you choose
       a topic, and whether to use any words, words that are <em>new to you</em>, or words you have
       <em>studied before</em>. Recordings play as you go; switch off <em>Play sounds automatically</em> if you would
       rather press play yourself. The games work with a mouse, a touch screen, a keyboard or a screen reader.</p>

    <h3>Your lists</h3>
    <p>Tap the bookmark button
       <span class="study inline" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4.2-5.5 4.2z"/></svg></span>
       on any word to add it to your <strong>study list</strong>. The <strong>My lists</strong> tab shows your study list,
       your <strong>tricky words</strong> (words you got wrong in the games, or marked “Still learning” on a flashcard),
       and how many words you have practised. Choose either list as the topic in any game to practise those words.
       You can save a list as a spreadsheet, or share your study list as a link, for example with a class.</p>
    <p>Your lists, progress and settings are kept in your browser on this device only: nothing is sent to anyone.
       To keep them safe, or to move them to another phone or computer, use <strong>Back up your data</strong>
       on the My lists tab.</p>

    <h3>Using the dictionary offline</h3>
    <p>Once you have opened the dictionary, it works without an internet connection: the words, entries, games and
       your lists are saved on your device. Recordings are saved as you play them, or you can save them all here
       (about <span data-audio-size>40 MB</span>).</p>
    <p>On a phone or iPad, add the dictionary to your home screen to open it like an app. In Safari: tap Share, then
       <em>Add to Home Screen</em>. In Chrome: open the ⋮ menu, then <em>Add to Home screen</em> or <em>Install app</em>.
       On an iPhone or iPad, saved recordings are kept best when the dictionary is on the home screen.</p>
    <p class="share-row" data-offline-tools><button type="button" class="gbtn" data-save-audio>Save all recordings</button>
       <button type="button" class="gbtn" data-clear-audio>Remove saved recordings</button></p>
    <p class="gnote" role="status" data-offline-msg></p>

    <h3>Searching</h3>
    <p>Type in the search box at the top. <strong>Both</strong> searches Kullilli words and English meanings at once;
       the other two buttons search only one side.</p>
    <ul>
      <li><strong>Kullilli search</strong> matches headwords, variant spellings, and the spellings used in the original
        sources (such as <span class="v">ŋuᶁa</span> for <span class="v">ngudya</span>). Exact spellings come first; after them
        come similar spellings: <em>k/g</em>, <em>p/b</em>, <em>t/d</em>, <em>dh/d</em>, <em>nh/n</em>, <em>rr/r</em>,
        <em>j/dy/tj</em>, long and short vowels, <em>o/u</em>, and small typing mistakes.</li>
      <li><strong>English search</strong> looks at glosses, definitions and notes. It ignores word endings
        (<em>bite, bites, biting</em>), allows small spelling mistakes, and needs every word you type to match.</li>
      <li>Tick <strong>include example sentences</strong> to search inside example sentences as well.</li>
    </ul>

    <h3>Reading an entry</h3>
    <ul>
      <li>Numbered meanings are separate senses, often from different sources.</li>
      <li>Example sentences show each word, the parts it is made of (tap a part to go to its entry), what each part
        means, and a translation. Grammatical parts are shown as abbreviations such as <abbr class="gab">ACC</abbr>
        or <abbr class="gab">1SG.ERG</abbr>: hover over one, or tap it on a phone, to see what it means.
        The full list is below.</li>
      <li><em>Original spelling</em> shows how the word was written in the source it comes from.</li>
      <li>Variant spellings link to their own entries, and those entries point back to the main word.</li>
      <li><em>Notes, etymology and sources</em> at the end of an entry lists pronunciation notes, borrowings, and which
        sources record the word.</li>
    </ul>

    <h3>Abbreviations</h3>
    <dl class="abbr-list" data-abbr-list></dl>

    <h3>Feedback</h3>
    <p>Found a problem, have an idea for a new activity, or know something about a word or its meaning?
       <a href="#/feedback">Send feedback</a>. Every entry also has a “Comment on this word” link at the bottom.</p>

    <h3>Sources</h3>
    <p>Words come from Breen's fieldnotes (also written <em>brefn</em>), the Galali sentence list and Galali vocabulary list,
       Holmer (<em>hol88</em>), Tindale (<em>tin57</em>), and McDonald and Wurm.</p>
  </article>
